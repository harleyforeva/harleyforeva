<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenSim TV</title>
  <style>
    body { background: #222; color: #fff; font-family: Arial, sans-serif; text-align: center; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 90vw; margin: 2em auto; }
    .video-container iframe { position: absolute; top:0; left:0; width:100%; height:100%; }
  </style>
</head>
<body>
  <h1>OpenSim TV - YouTube Channel</h1>
  <div class="video-container">
    <!-- Replace the src URL below with your YouTube video's embed URL -->
    <iframe 
      src="https://www.youtube.com/embed/VIDEO_ID_HERE" 
      frameborder="0" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
